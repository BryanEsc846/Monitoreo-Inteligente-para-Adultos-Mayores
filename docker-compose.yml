services:
  postgres:
    image: postgres:latest
    container_name: vitalia-postgres
    restart: always
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?Define POSTGRES_USER in .env}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}"
      POSTGRES_DB: "${POSTGRES_DB:?Define POSTGRES_DB in .env}"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  db-init:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vitalia-db-init
    command: ["python", "seed.py"]
    restart: "no"
    environment:
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:?Define POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:?Define POSTGRES_DB in .env}"
      SECRET_KEY: "${SECRET_KEY:?Define SECRET_KEY in .env}"
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vitalia-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:?Define POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:?Define POSTGRES_DB in .env}"
      SECRET_KEY: "${SECRET_KEY:?Define SECRET_KEY in .env}"
      PORT: "8000"
    depends_on:
      db-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
